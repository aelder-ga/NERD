name: Deploy NERD to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nerd-dork-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Check Azure deployment connection
        env:
          AZURE_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$AZURE_DEPLOYMENT_TOKEN" ]; then
            echo '::error::Add the nerd-dork deployment token as the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN, then rerun this workflow.'
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check add-in behavior
        run: node --test tests/*.test.cjs
      - name: Build Azure frontend
        run: npm run build:azure
      - name: Generate Azure Office manifest
        run: npm run manifest:azure -- https://thankful-sky-0cc1b0210.6.azurestaticapps.net
      - name: Deploy frontend and managed Azure Functions
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
