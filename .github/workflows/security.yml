name: Security review
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: Scan complete reachable history
        run: gitleaks detect --source . --log-opts=--all --redact --exit-code=1
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev
      - run: npm audit --omit=dev --prefix sharepoint/dork-dashboard
      - run: npm audit --omit=dev --prefix sharepoint/geek-launcher
      - run: node --test tests/*.test.cjs
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          output: codeql-results
      - name: Check security findings
        run: |
          python3 - <<'PY'
          import json, pathlib
          files = list(pathlib.Path('codeql-results').glob('*.sarif'))
          if not files:
              raise SystemExit('CodeQL did not produce results.')
          findings = []
          for file in files:
              for run in json.loads(file.read_text())['runs']:
                  components = [run['tool']['driver']] + run['tool'].get('extensions', [])
                  rules = {rule['id']: rule for component in components for rule in component.get('rules', [])}
                  for result in run.get('results', []):
                      rule = rules.get(result['ruleId'], {})
                      severity = float(rule.get('properties', {}).get('security-severity', 0))
                      location = result.get('locations', [{}])[0].get('physicalLocation', {})
                      path = location.get('artifactLocation', {}).get('uri', '')
                      line = location.get('region', {}).get('startLine', 0)
                      print(f"{result['ruleId']} severity={severity} {path}:{line}")
                      if severity >= 4 or (severity == 0 and result.get('level', rule.get('defaultConfiguration', {}).get('level', 'warning')) in ('warning', 'error')):
                          findings.append(result['ruleId'])
          print(f'Medium-or-higher security findings: {len(findings)}')
          raise SystemExit(bool(findings))
          PY
